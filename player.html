<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriveOS // Audio Stream Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#050508;
    --panel:#07070a;
    --cyan:#00F5FF;
    --gold:#FFD700;
    --slate:#5C7480;
    --slate-light: rgba(199,213,218,0.62);
    --text:#E7F3F5;
    --font:'JetBrains Mono','IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:36px 16px;
    font-family:var(--font);
    color:var(--text);
    background:
      radial-gradient(ellipse 1100px 700px at 50% -12%, rgba(0,245,255,0.07), transparent 60%),
      radial-gradient(ellipse 900px 650px at 105% 115%, rgba(255,215,0,0.045), transparent 60%),
      var(--void);
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(92,116,128,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(92,116,128,0.06) 1px, transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse 70% 65% at 50% 38%, black 35%, transparent 88%);
    mask-image:radial-gradient(ellipse 70% 65% at 50% 38%, black 35%, transparent 88%);
    pointer-events:none;
    z-index:0;
  }

  .stage{ position:relative; z-index:1; width:100%; display:flex; justify-content:center; }

  /* ---------- deck shell ---------- */
  .deck{
    position:relative;
    width:min(880px, 100%);
    border-radius:20px;
    background:rgba(10,13,17,0.6);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid rgba(92,116,128,0.25);
    box-shadow:0 30px 80px -30px rgba(0,0,0,0.85), 0 0 0 1px rgba(0,245,255,0.04);
    overflow:hidden;
  }

  .corner{ position:absolute; width:16px; height:16px; border-color:rgba(0,245,255,0.45); pointer-events:none; z-index:2; }
  .corner-tl{ top:9px; left:9px; border-top:2px solid; border-left:2px solid; border-radius:3px 0 0 0; }
  .corner-tr{ top:9px; right:9px; border-top:2px solid; border-right:2px solid; border-radius:0 3px 0 0; }
  .corner-bl{ bottom:9px; left:9px; border-bottom:2px solid; border-left:2px solid; border-radius:0 0 0 3px; }
  .corner-br{ bottom:9px; right:9px; border-bottom:2px solid; border-right:2px solid; border-radius:0 0 3px 0; }

  /* ---------- header ---------- */
  .deck-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 30px; border-bottom:1px solid rgba(92,116,128,0.2);
  }
  .brand-mark{ font-size:15px; font-weight:700; letter-spacing:0.07em; }
  .brand-accent{ color:var(--gold); }
  .brand-sub{ font-size:10.5px; letter-spacing:0.09em; color:var(--slate-light); margin-top:4px; }

  .status-badge{
    position:relative;
    display:inline-flex; align-items:center; gap:9px;
    padding:6px 14px 6px 12px;
    border-radius:20px;
    font-size:10.5px; letter-spacing:0.1em;
    color:var(--slate-light);
    border:1px solid rgba(92,116,128,0.4);
    background:rgba(255,255,255,0.015);
    white-space:nowrap;
  }
  .status-badge::before{
    content:''; width:7px; height:7px; border-radius:50%;
    background:var(--slate);
    flex-shrink:0;
  }
  .status-badge.is-online{ color:var(--cyan); border-color:rgba(0,245,255,0.4); }
  .status-badge.is-online::before{
    background:var(--cyan);
    box-shadow:0 0 8px 3px rgba(0,245,255,0.55);
    animation:pulse 1.8s ease-in-out infinite;
  }

  /* ---------- body grid ---------- */
  .deck-body{
    display:grid; grid-template-columns:250px 1fr; gap:36px;
    padding:32px 30px;
  }

  /* ---------- holographic album art ---------- */
  .art-column{ display:flex; flex-direction:column; align-items:center; }

  .art-stage{
    position:relative;
    width:100%; max-width:230px; aspect-ratio:1/1;
    border-radius:12px; overflow:hidden;
    background:linear-gradient(160deg, rgba(0,245,255,0.07), rgba(5,5,8,0.5));
    border:1px solid rgba(0,245,255,0.28);
    box-shadow:0 0 0 1px rgba(0,245,255,0.07), 0 0 42px rgba(0,245,255,0.16), 0 25px 45px -22px rgba(0,0,0,0.85);
    transform:perspective(900px) rotateX(5deg) rotateY(-4deg);
    transition:transform .5s ease;
    animation:hologram-flicker 7s infinite;
  }
  .art-stage:hover{ transform:perspective(900px) rotateX(0deg) rotateY(0deg); }

  .art-corner{ position:absolute; width:13px; height:13px; border-color:rgba(255,215,0,0.75); z-index:2; pointer-events:none; }
  .ac-tl{ top:6px; left:6px; border-top:1.5px solid; border-left:1.5px solid; }
  .ac-tr{ top:6px; right:6px; border-top:1.5px solid; border-right:1.5px solid; }
  .ac-bl{ bottom:6px; left:6px; border-bottom:1.5px solid; border-left:1.5px solid; }
  .ac-br{ bottom:6px; right:6px; border-bottom:1.5px solid; border-right:1.5px solid; }

  #album-art{ width:100%; height:100%; object-fit:cover; display:block; transition:opacity .22s ease; }

  .art-scan{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,245,255,0.05) 0px, rgba(0,245,255,0.05) 1px, transparent 2px, transparent 4px);
    mix-blend-mode:overlay;
    overflow:hidden;
  }
  .art-scan::after{
    content:''; position:absolute; left:0; right:0; height:38%;
    background:linear-gradient(to bottom, transparent, rgba(0,245,255,0.3), transparent);
    animation:scan-sweep 4.5s linear infinite;
  }

  .art-base{
    width:64%; max-width:170px; height:12px; margin:-4px auto 0;
    background:radial-gradient(ellipse at center, rgba(0,245,255,0.4), transparent 72%);
    filter:blur(3px);
  }

  .now-streaming{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:16px; font-size:10.5px; letter-spacing:0.12em; color:var(--slate-light);
  }
  .pulse-dot{
    width:6px; height:6px; border-radius:50%; background:var(--gold);
    box-shadow:0 0 6px 2px rgba(255,215,0,0.55);
    animation:pulse 1.6s ease-in-out infinite;
  }

  /* ---------- track + controls column ---------- */
  .control-column{ display:flex; flex-direction:column; justify-content:center; min-width:0; }

  .track-info h1{
    margin:0; font-size:clamp(1.25rem, 2.1vw, 1.7rem); font-weight:600;
    letter-spacing:0.005em; line-height:1.25; color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .track-info p{
    margin:6px 0 0; font-size:0.92rem; color:var(--slate-light);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .visualizer{ display:flex; align-items:flex-end; gap:3px; height:34px; margin:20px 0; }
  .visualizer .bar{
    flex:1; min-width:2px; border-radius:2px;
    background:linear-gradient(to top, var(--cyan), rgba(0,245,255,0.12));
    transform:scaleY(0.22); transform-origin:bottom;
    animation:bar-bounce 1.1s ease-in-out infinite;
    animation-play-state:paused;
  }
  .deck.is-playing .visualizer .bar{ animation-play-state:running; }

  .progress-row{ display:flex; align-items:center; gap:10px; margin:4px 0 20px; }
  .time{ font-size:11.5px; color:var(--slate-light); min-width:34px; text-align:center; font-variant-numeric:tabular-nums; }

  #playback-progress{
    -webkit-appearance:none; appearance:none;
    flex:1; height:5px; border-radius:4px; cursor:pointer; outline:none;
    background:linear-gradient(to right, var(--cyan) 0%, var(--cyan) var(--fill,0%), rgba(92,116,128,0.28) var(--fill,0%), rgba(92,116,128,0.28) 100%);
  }
  #playback-progress::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--gold); box-shadow:0 0 8px 2px rgba(255,215,0,0.6);
    margin-top:0;
  }
  #playback-progress::-moz-range-track{ height:5px; border-radius:4px; background:rgba(92,116,128,0.28); }
  #playback-progress::-moz-range-progress{ height:5px; border-radius:4px; background:var(--cyan); }
  #playback-progress::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%; border:none;
    background:var(--gold); box-shadow:0 0 8px 2px rgba(255,215,0,0.6);
  }
  #playback-progress:disabled{ opacity:0.35; cursor:not-allowed; }

  .controls{ display:flex; align-items:center; justify-content:center; gap:18px; }
  .ctrl-btn{
    width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(92,116,128,0.5);
    background:rgba(255,255,255,0.02);
    color:var(--slate-light);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:box-shadow .2s ease, border-color .2s ease, color .2s ease;
  }
  .ctrl-btn:hover:not(:disabled){ border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 12px rgba(0,245,255,0.35); }
  .ctrl-btn:active:not(:disabled){ transform:translateY(1px); }
  .ctrl-btn:disabled{ opacity:0.3; cursor:not-allowed; }
  .ctrl-btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  .ctrl-btn-play{
    width:56px; height:56px;
    border-color:rgba(255,215,0,0.55);
    color:var(--gold);
    background:rgba(255,215,0,0.05);
  }
  .ctrl-btn-play:hover:not(:disabled){ border-color:var(--gold); color:var(--gold); box-shadow:0 0 18px rgba(255,215,0,0.4); }
  .ctrl-btn-play .icon-pause{ display:none; }
  .ctrl-btn-play.is-playing .icon-play{ display:none; }
  .ctrl-btn-play.is-playing .icon-pause{ display:block; }

  /* ---------- system log ---------- */
  .log-panel{ border-top:1px solid rgba(92,116,128,0.22); background:rgba(0,0,0,0.32); padding:14px 30px 18px; }
  .log-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .log-title{ font-size:10.5px; letter-spacing:0.14em; color:var(--slate-light); }
  .log-dot{ width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 6px 2px rgba(0,245,255,0.5); animation:pulse 2.2s ease-in-out infinite; }

  #player-log{
    height:104px; overflow-y:auto; font-size:11.5px; line-height:1.65;
    color:rgba(190,206,211,0.85);
  }
  #player-log::-webkit-scrollbar{ width:6px; }
  #player-log::-webkit-scrollbar-thumb{ background:rgba(0,245,255,0.25); border-radius:3px; }
  #player-log::-webkit-scrollbar-track{ background:transparent; }
  .log-line{ white-space:pre-wrap; word-break:break-word; }
  .log-time{ color:var(--slate-light); margin-right:6px; }
  .log-ok{ color:var(--cyan); }
  .log-action{ color:var(--gold); }
  .log-err{ color:var(--slate-light); font-style:italic; }

  /* ---------- keyframes ---------- */
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.4; transform:scale(.8);} }
  @keyframes scan-sweep{ 0%{ transform:translateY(-100%); opacity:0;} 12%{ opacity:.85;} 88%{ opacity:.85;} 100%{ transform:translateY(160%); opacity:0;} }
  @keyframes bar-bounce{ 0%,100%{ transform:scaleY(.22);} 50%{ transform:scaleY(1);} }
  @keyframes hologram-flicker{
    0%, 19%, 21%, 23%, 80%, 100%{ filter:brightness(1); }
    20%{ filter:brightness(1.14); }
    22%{ filter:brightness(0.93); }
  }

  @media (max-width:700px){
    .deck-body{ grid-template-columns:1fr; gap:26px; }
    .art-stage{ max-width:190px; }
    .track-info h1, .track-info p{ text-align:center; white-space:normal; }
    .deck-header{ padding:18px 20px; }
    .deck-body{ padding:26px 20px; }
    .log-panel{ padding:14px 20px 16px; }
  }

  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="deck" id="deck">
      <span class="corner corner-tl" aria-hidden="true"></span>
      <span class="corner corner-tr" aria-hidden="true"></span>
      <span class="corner corner-bl" aria-hidden="true"></span>
      <span class="corner corner-br" aria-hidden="true"></span>

      <header class="deck-header">
        <div>
          <div class="brand-mark">DRIVE<span class="brand-accent">//OS</span></div>
          <div class="brand-sub">SPOTIFY CONNECT MIRROR</div>
        </div>
        <div class="status-badge" id="conn-status">OFFLINE</div>
      </header>

      <main class="deck-body">
        <section class="art-column">
          <div class="art-stage">
            <span class="art-corner ac-tl" aria-hidden="true"></span>
            <span class="art-corner ac-tr" aria-hidden="true"></span>
            <span class="art-corner ac-bl" aria-hidden="true"></span>
            <span class="art-corner ac-br" aria-hidden="true"></span>
            <div class="art-scan" aria-hidden="true"></div>
            <img id="album-art" src="" alt="Album artwork for the current track">
          </div>
          <div class="art-base" aria-hidden="true"></div>
          <div class="now-streaming"><span class="pulse-dot" aria-hidden="true"></span>NOW STREAMING</div>
        </section>

        <section class="control-column">
          <div class="track-info">
            <h1 id="track-title">No signal</h1>
            <p id="track-artist">Waiting on receiver</p>
          </div>

          <div class="visualizer" id="visualizer" aria-hidden="true"></div>

          <div class="progress-row">
            <span class="time" id="current-time">0:00</span>
            <input type="range" id="playback-progress" min="0" max="100" value="0" step="1" aria-label="Playback position" disabled>
            <span class="time" id="total-duration">0:00</span>
          </div>

          <div class="controls" role="group" aria-label="Playback controls">
            <button type="button" class="ctrl-btn" id="prev-btn" aria-label="Previous track" disabled onclick="window.sendControl('prev')">
              <svg viewBox="0 0 24 24" width="17" height="17"><path d="M6 6h2v12H6zM20 6L9 12l11 6z" fill="currentColor"/></svg>
            </button>
            <button type="button" class="ctrl-btn ctrl-btn-play" id="play-pause-btn" aria-label="Play" disabled onclick="window.togglePlayPause()">
              <svg class="icon-play" viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" width="20" height="20"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
            </button>
            <button type="button" class="ctrl-btn" id="next-btn" aria-label="Next track" disabled onclick="window.sendControl('next')">
              <svg viewBox="0 0 24 24" width="17" height="17"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z" fill="currentColor"/></svg>
            </button>
          </div>
        </section>
      </main>

      <footer class="log-panel">
        <div class="log-header">
          <span class="log-title">SYSTEM LOG</span>
          <span class="log-dot" aria-hidden="true"></span>
        </div>
        <div id="player-log" role="log" aria-live="polite"></div>
      </footer>
    </div>
  </div>

<script>
(function(){
  'use strict';

  var els = {
    deck: document.getElementById('deck'),
    connStatus: document.getElementById('conn-status'),
    albumArt: document.getElementById('album-art'),
    trackTitle: document.getElementById('track-title'),
    trackArtist: document.getElementById('track-artist'),
    progress: document.getElementById('playback-progress'),
    currentTime: document.getElementById('current-time'),
    totalDuration: document.getElementById('total-duration'),
    playPauseBtn: document.getElementById('play-pause-btn'),
    prevBtn: document.getElementById('prev-btn'),
    nextBtn: document.getElementById('next-btn'),
    visualizer: document.getElementById('visualizer'),
    log: document.getElementById('player-log')
  };

  var state = { title:null, artist:null, cover:null, progress:0, duration:0, isPlaying:false, online:false };

  /* ---------- utilities ---------- */

  function fmtTime(sec){
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function logLine(msg, kind){
    var time = new Date().toLocaleTimeString('en-GB');
    var line = document.createElement('div');
    line.className = 'log-line' + (kind ? ' log-' + kind : '');
    var timeSpan = document.createElement('span');
    timeSpan.className = 'log-time';
    timeSpan.textContent = '[' + time + ']';
    line.appendChild(timeSpan);
    line.appendChild(document.createTextNode(' ' + msg));
    els.log.appendChild(line);
    els.log.scrollTop = els.log.scrollHeight;
    while (els.log.children.length > 120) els.log.removeChild(els.log.firstChild);
  }

  function updateProgressFill(){
    var max = parseFloat(els.progress.max) || 0;
    var val = parseFloat(els.progress.value) || 0;
    var pct = max > 0 ? (val / max) * 100 : 0;
    els.progress.style.setProperty('--fill', pct + '%');
  }

  function setControlsEnabled(enabled){
    [els.progress, els.prevBtn, els.nextBtn, els.playPauseBtn].forEach(function(el){
      el.disabled = !enabled;
    });
  }

  /* ---------- placeholder / generative cover art (no network dependency) ---------- */

  function buildCover(primary, secondary, glyph){
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0%" stop-color="' + primary + '" stop-opacity="0.32"/>' +
      '<stop offset="100%" stop-color="#050508" stop-opacity="1"/>' +
      '</linearGradient></defs>' +
      '<rect width="400" height="400" fill="#0b0d12"/>' +
      '<rect width="400" height="400" fill="url(#g)"/>' +
      '<g stroke="' + secondary + '" stroke-opacity="0.35" stroke-width="1" fill="none">' +
      '<circle cx="200" cy="200" r="148"/><circle cx="200" cy="200" r="108"/>' +
      '<path d="M36 200 H364 M200 36 V364"/></g>' +
      '<text x="200" y="224" font-family="JetBrains Mono, monospace" font-size="118" font-weight="700" ' +
      'fill="' + primary + '" fill-opacity="0.85" text-anchor="middle">' + glyph + '</text>' +
      '</svg>';
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  var NO_SIGNAL_COVER =
    'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">' +
      '<rect width="400" height="400" fill="#0b0d12"/>' +
      '<circle cx="200" cy="200" r="120" fill="none" stroke="#5C7480" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="10 10"/>' +
      '<text x="200" y="206" font-family="JetBrains Mono, monospace" font-size="17" letter-spacing="2" ' +
      'fill="#5C7480" fill-opacity="0.75" text-anchor="middle">NO SIGNAL</text>' +
      '</svg>'
    );

  els.albumArt.src = NO_SIGNAL_COVER;

  /* ---------- audio visualizer bars ---------- */

  var BAR_COUNT = 26;
  for (var i = 0; i < BAR_COUNT; i++){
    var bar = document.createElement('span');
    bar.className = 'bar';
    bar.style.animationDelay = (Math.random() * 1).toFixed(2) + 's';
    bar.style.animationDuration = (0.7 + Math.random() * 0.7).toFixed(2) + 's';
    els.visualizer.appendChild(bar);
  }

  /* ---------- public API required by DriveOS ---------- */

  window.updatePlayerState = function(data){
    if (!data || typeof data !== 'object') return;

    if (data.title !== undefined){
      state.title = data.title;
      els.trackTitle.textContent = data.title || 'No signal';
    }
    if (data.artist !== undefined){
      state.artist = data.artist;
      els.trackArtist.textContent = data.artist || 'Waiting on receiver';
    }
    if (data.cover !== undefined && data.cover !== state.cover){
      state.cover = data.cover;
      els.albumArt.style.opacity = '0';
      setTimeout(function(){
        els.albumArt.src = data.cover || NO_SIGNAL_COVER;
        els.albumArt.style.opacity = '1';
      }, 160);
    }
    if (data.duration !== undefined){
      state.duration = data.duration;
      els.progress.max = data.duration;
      els.totalDuration.textContent = fmtTime(data.duration);
    }
    if (data.progress !== undefined){
      state.progress = data.progress;
      els.progress.value = data.progress;
      els.currentTime.textContent = fmtTime(data.progress);
      updateProgressFill();
    }
    if (data.isPlaying !== undefined){
      setPlayingVisual(!!data.isPlaying);
    }
  };

  window.setConnectionState = function(isOnline){
    state.online = !!isOnline;
    els.connStatus.textContent = isOnline ? 'RECEIVER ONLINE' : 'OFFLINE';
    els.connStatus.classList.toggle('is-online', !!isOnline);
    setControlsEnabled(!!isOnline);
    logLine(isOnline ? 'Receiver online — synced with Spotify Connect' : 'Receiver offline — signal lost', isOnline ? 'ok' : 'err');
    if (!isOnline){
      setPlayingVisual(false);
    }
  };

  window.sendControl = function(action){
    logLine('Control → ' + String(action).toUpperCase(), 'action');
    if (window.AndroidBridge) {
      window.AndroidBridge.sendControl(action);
    } else {
      logLine('Bridge Error: AndroidBridge not found', 'err');
    }
  };

  window.togglePlayPause = function(){
    window.sendControl(state.isPlaying ? 'pause' : 'play');
  };

  function setPlayingVisual(isPlaying){
    state.isPlaying = isPlaying;
    els.deck.classList.toggle('is-playing', isPlaying);
    els.playPauseBtn.classList.toggle('is-playing', isPlaying);
    els.playPauseBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
  }

  els.progress.addEventListener('input', function(){
    els.currentTime.textContent = fmtTime(els.progress.value);
    updateProgressFill();
  });
  els.progress.addEventListener('change', function(){
    state.progress = parseFloat(els.progress.value) || 0;
    logLine('Seek → ' + fmtTime(els.progress.value), 'action');
  });

     via window.updatePlayerState() and window.setConnectionState().

})();
