<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriveOS · Web Audio Receiver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070a;
    --card: #0e1118;
    --cyan: #00F5FF;
    --cyan-glow: rgba(0, 245, 255, 0.25);
    --gold: #FFD700;
    --muted: #5C7480;
    --border: #182632;
    --font: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at 50% 10%, rgba(0, 245, 255, 0.08), transparent 70%), var(--bg);
    color: #fff;
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .deck-card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 0 40px var(--cyan-glow);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .deck-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }

  .deck-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--cyan);
    text-transform: uppercase;
  }

  .status-badge {
    font-size: 9px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .player-cover-wrap {
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    position: relative;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
  }

  #spotify-auth-btn {
    background: var(--cyan);
    color: #000;
    border: none;
    padding: 10px 20px;
    font-family: var(--font);
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
    text-transform: uppercase;
    transition: 0.2s;
  }

  #spotify-auth-btn:hover {
    background: #fff;
    box-shadow: 0 0 15px var(--cyan);
  }

  .meta-title {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meta-artist {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .log-box {
    background: #000;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 9px;
    color: var(--muted);
    height: 90px;
    overflow-y: auto;
  }

  .log-line { margin-bottom: 4px; }
  .log-line.cmd { color: var(--gold); }
</style>
</head>
<body>

<div class="deck-card">
  <div class="deck-header">
    <div class="deck-title">DriveOS · Web Audio Receiver</div>
    <div class="status-badge" id="conn-badge">Connecting...</div>
  </div>

  <div class="player-cover-wrap" id="player-ui">
    <button id="spotify-auth-btn">Connect Spotify Premium</button>
    <div id="playback-status" style="font-size: 10px; color: var(--muted);">Awaiting Authentication...</div>
  </div>

  <div>
    <div class="meta-title" id="now-title">Ready for Stream</div>
    <div class="meta-artist" id="now-artist">Awaiting command from Cockpit Admin...</div>
  </div>

  <div class="log-box" id="player-log">
    <div class="log-line">[SYS]: Audio playback receiver node initialized.</div>
  </div>
</div>

<script src="https://sdk.spotify.com/api/web-playback-sdk.js"></script>
<script>
const WS_PROTOCOL = location.protocol === 'https:' ? 'wss://' : 'ws://';
const params = new URLSearchParams(location.search);
const deviceId = params.get('device') || 'myaura001';

const nowTitle = document.getElementById('now-title');
const nowArtist = document.getElementById('now-artist');
const connBadge = document.getElementById('conn-badge');
const logBox = document.getElementById('player-log');
const authBtn = document.getElementById('spotify-auth-btn');
const playbackStatus = document.getElementById('playback-status');
const playerUI = document.getElementById('player-ui');

let spotifyPlayer = null;

function log(msg, isCmd) {
  const div = document.createElement('div');
  div.className = 'log-line' + (isCmd ? ' cmd' : '');
  div.textContent = `[${new Date().toLocaleTimeString()}]: ${msg}`;
  logBox.prepend(div);
}

// Handle Spotify Auth Redirect
authBtn.onclick = () => {
    window.location.href = `/spotify/login?device=${encodeURIComponent(deviceId)}`;
};

async function initSpotifyPlayer() {
    try {
        const res = await fetch(`/api/spotify/token?device=${encodeURIComponent(deviceId)}`);
        if (!res.ok) throw new Error('No active session');
        const { token } = await res.json();

        log('Connecting to Spotify SDK...', false);

        spotifyPlayer = new Spotify.Player({
            name: `DriveOS Headunit [${deviceId}]`,
            getToken: async () => token,
            volume: 0.8
        });

        spotifyPlayer.addListener('ready', () => {
            log('⚡ SPOTIFY SDK READY: Full Playback Active', true);
            authBtn.style.display = 'none';
            playbackStatus.textContent = 'PREMIUM SESSION ACTIVE';
            playbackStatus.style.color = '#00FF9C';
        });

        spotifyPlayer.addListener('player_state_changed', state => {
            if (!state) return;
            const track = state.track;
            if (track) {
                nowTitle.textContent = track.name;
                nowArtist.textContent = track.artists.map(a => a.name).join(', ');
            }
        });

        await spotifyPlayer.connect();
    } catch (err) {
        log('Spotify SDK not initialized. Please connect.', false);
    }
}

// Connect as player listener
const ws = new WebSocket(`${WS_PROTOCOL}${location.host}?role=player&device=${encodeURIComponent(deviceId)}&secret=driveos2secret`);

ws.onopen = () => {
  connBadge.textContent = 'RECEIVER ONLINE';
  connBadge.style.borderColor = '#00FF9C';
  connBadge.style.color = '#00FF9C';
  log(`Linked to Cluster Rig [${deviceId}] as Audio Output`);
  initSpotifyPlayer();
};

ws.onmessage = (e) => {
  try {
    const data = JSON.parse(e.data);

    if (data.type === 'cmd_spotify_play') {
      const track = data.track || {};
      const uri = data.uri || track.uri || '';

      if (uri && spotifyPlayer) {
        spotifyPlayer.play(uri).then(() => {
            log(`⚡ FULL PLAYBACK: ${track.title || 'Track'}`, true);
        }).catch(err => {
            log(`Playback Error: ${err.message}`, false);
        });
      } else if (!spotifyPlayer) {
          log('Cannot play: Spotify SDK not connected.', false);
      }
    }
  } catch (err) {}
};

ws.onclose = () => {
  connBadge.textContent = 'OFFLINE';
  connBadge.style.borderColor = '#FF3B5C';
  connBadge.style.color = '#FF3B5C';
  log('Connection lost. Reconnect when ready.');
};
</script>
</body>
</html>
